# OmacVM: Omarchy's default is zram-size = ram (as much swap as the VM has
# memory). Parallels, UTM and Fusion keep every page the VM touched until it
# stops (their balloons do not report free pages), so pages swapped into zram
# only add to what the VM holds. OmacVM.app's balloon reports free pages, but
# a swap-out frees memory in blocks too small to report (974 MB swapped out:
# 600 MB freed in the VM, none of it back to the Mac before a compaction), so
# a small zram is right there too. 8 GB is plenty for bursts.
# zstd: the stock kernel (7.2.11) builds zram with LZO only
# (CONFIG_ZRAM_BACKEND_FORCE_LZO), ignores this line and runs lzo-rle (about
# 2.7:1); a kernel with zstd for zram uses it.
[zram0]
zram-size = min(ram / 4, 8192)
compression-algorithm = zstd
