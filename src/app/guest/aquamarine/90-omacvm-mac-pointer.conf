# OmacVM.app: in a start that asks for the Mac pointer, the compositor loads
# OmacVM's aquamarine (cursor hotspots) instead of Omarchy's.
# omacvm-app-host writes the file at boot, only then and only when that
# library is built for the installed package (omacvm-aquamarine-build).
[Service]
EnvironmentFile=-/run/omacvm/mac-pointer.env
