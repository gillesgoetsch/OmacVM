# OmacVM (guest/install.sh, guest/omarchy-45.sh): read-only snapshots picked
# in GRUB boot with a writable overlay (grub-btrfs-overlayfs). Limine's
# btrfs-overlayfs, which Omarchy 4.5's 00-omarchy-hooks.conf names, goes when
# it is not installed (a GRUB VM): mkinitcpio fails on a missing hook.
_omacvm_h=(); for _omacvm_x in "${HOOKS[@]}"; do [[ $_omacvm_x == btrfs-overlayfs && ! -e /usr/lib/initcpio/install/btrfs-overlayfs ]] || _omacvm_h+=("$_omacvm_x"); done
HOOKS=("${_omacvm_h[@]}"); unset _omacvm_h _omacvm_x
[[ " ${HOOKS[*]} " == *" grub-btrfs-overlayfs "* ]] || HOOKS+=(grub-btrfs-overlayfs)
