# OmacVM: RTKit keeps PipeWire's sound threads real-time after the VM was
# stopped. RTKit's watchdog (its "canary") takes 10 s in which the VM did not
# run while its clock went on (QEMU stopped from outside) for a runaway
# real-time thread and demotes every one of them for the rest of the session:
# then PipeWire runs at normal priority and the sound breaks whenever the VM
# is busy. Runaway threads are still stopped: RTKit only grants real-time to
# threads with RLIMIT_RTTIME set, and the kernel's fair server keeps normal
# threads running next to real-time ones.
[Service]
ExecStart=
ExecStart=/usr/lib/rtkit-daemon --no-canary
