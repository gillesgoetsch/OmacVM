<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d">
<title id="t">How fast Omarchy runs in OmacVM.app, as a share of macOS itself</title>
<desc id="d">CPU, all cores (Geekbench 7): OmacVM.app 99 percent. Web apps (Speedometer 3.1): OmacVM.app 69 percent. Browser graphics (WebGL Aquarium, 30,000 fish): OmacVM.app 39 percent. Browser overall (Basemark Web 3.0): OmacVM.app 77 percent. GPU compute (Geekbench 7 GPU, OpenCL): OmacVM.app 45 percent. macOS itself is 100 percent; higher is better.</desc>
<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="20" y="20" width="2" height="2" fill="#26233a"/></pattern></defs>
<rect width="1000" height="430" fill="#191724"/><rect width="1000" height="430" fill="url(#dots)"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e0def4" font-weight="600" text-anchor="middle">How fast is Omarchy in OmacVM.app?</text>
<text x="500.0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#908caa" text-anchor="middle">MacBook Pro M4 Max · macOS 15.7 · Google Chrome 155 · October 2026</text>
<rect x="313" y="79" width="12" height="12" rx="3" fill="#ebbcba"/>
<text x="331" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e0def4" font-weight="600">OmacVM.app</text>
<line x1="434" y1="77" x2="434" y2="93" stroke="#e0def4" stroke-opacity="0.6" stroke-dasharray="3 3"/>
<text x="446" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e0def4">macOS itself = 100 %</text>
<text x="593" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6a86">higher is better</text>
<line x1="830" y1="118" x2="830" y2="358" stroke="#e0def4" stroke-opacity="0.45" stroke-dasharray="3 3"/>
<text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e0def4" font-weight="600">CPU, all cores</text>
<text x="40" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86">Geekbench 7</text>
