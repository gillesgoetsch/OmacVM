<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" width="1000" height="348" role="img" aria-labelledby="t d">
<title id="t">How fast Omarchy runs in OmacVM.app, as a share of macOS itself</title>
<desc id="d">CPU, all cores (Geekbench 7): OmacVM.app 99 percent. Web apps (Speedometer 3.1): OmacVM.app 69 percent. Browser graphics (WebGL Aquarium, 30,000 fish): OmacVM.app 39 percent. Browser overall (Basemark Web 3.0): OmacVM.app 77 percent. GPU compute (Geekbench 7 GPU, OpenCL): OmacVM.app 45 percent. macOS itself is 100 percent; higher is better.</desc>
<style>
:root{--card:#faf4ed;--edge:#dfdad9;--ink:#575279;--soft:#6f6b8a;--app:#d7827e;--mac:#797593}
@media (prefers-color-scheme: dark){:root{--card:#191724;--edge:#26233a;--ink:#e0def4;--soft:#908caa;--app:#ebbcba;--mac:#908caa}}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, monospace}
.ink{fill:var(--ink)}.soft{fill:var(--soft)}.b{font-weight:600}
.halo{stroke:var(--card);stroke-width:4;paint-order:stroke}
.app{fill:var(--app)}.mac{fill:var(--mac)}.card{fill:var(--card)}
.rule{stroke:var(--ink);stroke-opacity:.5;stroke-dasharray:3 3}
</style>
<rect width="1000" height="348" class="card"/>
<rect x="0.5" y="0.5" width="999" height="347" fill="none" stroke="var(--edge)"/>
<text x="36" y="34" font-size="17" class="ink b">How fast is Omarchy in OmacVM.app?</text>
<text x="964" y="34" font-size="12" class="soft" text-anchor="end">MacBook Pro M4 Max · macOS 15.7 · Google Chrome 155 · October 2026</text>
<text x="36" y="57" font-size="12" class="soft">Omarchy in the VM, as a share of the same Mac running macOS · higher is better</text>
<line x1="880" y1="80" x2="880" y2="288" class="rule"/>
<text x="880" y="74" font-size="11" class="soft halo" text-anchor="middle">macOS = 100 %</text>
<text x="36" y="101" font-size="14" class="ink b">CPU, all cores</text>
<text x="36" y="117" font-size="11" class="soft">Geekbench 7</text>
<path d="M280,88.0 h589.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-589.3 z" class="app"/>
<rect x="874.3" y="85" width="53" height="22" class="card"/>
<text x="882.3" y="101" font-size="14" class="ink mono b halo">99 %</text>
<text x="36" y="145" font-size="14" class="ink b">Web apps</text>
<text x="36" y="161" font-size="11" class="soft">Speedometer 3.1</text>
<path d="M280,132.0 h412.6 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-412.6 z" class="app"/>
<text x="705.6" y="145" font-size="14" class="ink mono b halo">69 %</text>
<text x="36" y="189" font-size="14" class="ink b">Browser graphics</text>
<text x="36" y="205" font-size="11" class="soft">WebGL Aquarium, 30,000 fish</text>
<path d="M280,176.0 h227.8 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-227.8 z" class="app"/>
<text x="520.8" y="189" font-size="14" class="ink mono b halo">39 %</text>
<text x="36" y="233" font-size="14" class="ink b">Browser overall</text>
<text x="36" y="249" font-size="11" class="soft">Basemark Web 3.0</text>
<path d="M280,220.0 h459.5 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-459.5 z" class="app"/>
<text x="752.5" y="233" font-size="14" class="ink mono b halo">77 %</text>
<text x="36" y="277" font-size="14" class="ink b">GPU compute</text>
<text x="36" y="293" font-size="11" class="soft">Geekbench 7 GPU, OpenCL</text>
<path d="M280,264.0 h263.3 a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h-263.3 z" class="app"/>
<text x="556.3" y="277" font-size="14" class="ink mono b halo">45 %</text>
<text x="36" y="320" font-size="11" class="soft">The VM 6 CPUs and 8 GB in a window; Chrome's page 1440x900 at 2x on both. Browser tests 2026-10-09, median of 3 runs.</text>
<text x="36" y="336" font-size="11" class="soft">Geekbench: CPU 2026-10-03 (single run), GPU compute 2026-10-04 with omacvm enable vulkan. Raw runs: docs/benchmarks.</text>
</svg>
