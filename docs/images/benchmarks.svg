<rect x="824.7" y="122" width="51" height="24" fill="#191724"/>
<text x="833.7" y="139" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#e0def4" font-weight="600" stroke="#191724" stroke-width="4" paint-order="stroke">99 %</text>
<text x="40" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e0def4" font-weight="600">Web apps</text>
<text x="40" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86">Speedometer 3.1</text>
<rect x="270" y="174" width="388.8" height="20" rx="4" fill="#ebbcba"/>
<text x="668.8" y="189" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#e0def4" font-weight="600" stroke="#191724" stroke-width="4" paint-order="stroke">69 %</text>
<text x="40" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e0def4" font-weight="600">Browser graphics</text>
<text x="40" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86">WebGL Aquarium, 30,000 fish</text>
