<text x="712.6" y="289" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#e0def4" font-weight="600" stroke="#191724" stroke-width="4" paint-order="stroke">77 %</text>
<text x="40" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e0def4" font-weight="600">GPU compute</text>
<text x="40" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86">Geekbench 7 GPU, OpenCL</text>
<rect x="270" y="324" width="249.4" height="20" rx="4" fill="#ebbcba"/>
<text x="529.4" y="339" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#e0def4" font-weight="600" stroke="#191724" stroke-width="4" paint-order="stroke">45 %</text>
<text x="500.0" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86" text-anchor="middle">The VM 6 CPUs and 8 GB in a window; Chrome's page 1440x900 at 2x on both. Browser tests 2026-10-09, median of 3 runs.</text>
<text x="500.0" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86" text-anchor="middle">Geekbench: CPU 2026-10-03 (single run), GPU compute 2026-10-04 with omacvm enable vulkan. Raw runs: docs/benchmarks.</text>
</svg>
