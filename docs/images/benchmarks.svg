<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" width="1000" height="514" role="img" aria-labelledby="t d">
<title id="t">How fast Omarchy runs in OmacVM.app, UTM, VMware Fusion and Parallels, as a share of macOS itself</title>
<desc id="d">CPU, all cores (Geekbench 7): OmacVM.app 99 percent, UTM 89 percent, VMware Fusion 99 percent, Parallels 96 percent. Web apps (Speedometer 3.1): OmacVM.app 70 percent, UTM 52 percent, VMware Fusion 71 percent, Parallels 67 percent. Browser graphics (WebGL Aquarium): OmacVM.app 22 percent, UTM 26 percent, VMware Fusion 38 percent, Parallels 25 percent. Browser overall (Basemark Web 3.0): OmacVM.app no full-screen run yet, UTM 67 percent, VMware Fusion 78 percent, Parallels 75 percent. GPU compute (Geekbench 7 GPU, OpenCL): OmacVM.app 45 percent (not released yet), UTM not available (no OpenCL or Vulkan), VMware Fusion not available (no OpenCL or Vulkan), Parallels not available (no OpenCL or Vulkan). macOS itself is 100 percent.</desc>
<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="20" y="20" width="2" height="2" fill="#26233a"/></pattern>
<pattern id="hatch-app" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ebbcba" fill-opacity="0.25"/><rect width="3" height="6" fill="#ebbcba"/></pattern>
<pattern id="hatch-utm" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#c4a7e7" fill-opacity="0.25"/><rect width="3" height="6" fill="#c4a7e7"/></pattern>
<pattern id="hatch-fusion" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f6c177" fill-opacity="0.25"/><rect width="3" height="6" fill="#f6c177"/></pattern>
<pattern id="hatch-parallels" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#9ccfd8" fill-opacity="0.25"/><rect width="3" height="6" fill="#9ccfd8"/></pattern>
</defs>
<rect width="1000" height="514" fill="#191724"/><rect width="1000" height="514" fill="url(#dots)"/>
