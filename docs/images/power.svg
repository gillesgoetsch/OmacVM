<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" width="1000" height="544" role="img" aria-labelledby="t d">
<title id="t">Power draw of the whole Mac with Omarchy in OmacVM.app, and with macOS itself</title>
<desc id="d">Idle (the desktop, nothing open): OmacVM.app 3.0.3 6.13 W (8.6 h), macOS 5.20 W (10.1 h). Reading (Chrome scrolling a text page): OmacVM.app 3.0.3 6.11 W (8.6 h), macOS 5.48 W (9.6 h). YouTube 4K (VP9, SDR, 60 fps; both on the Mac's media engine): OmacVM.app 3.0.3 (Omarchy's Chromium) 10.10 W (5.2 h), macOS (Google Chrome) 6.07 W (8.7 h). Every core busy (every core at 100 %: the VM's 4, the Mac's 8): OmacVM.app 3.0.3 21.01 W (2.5 h), macOS 19.69 W (2.7 h). WebGL Aquarium (30,000 fish in Chrome; each draws its own frame rate): OmacVM.app 3.0.3 (19 fps) 17.11 W (3.1 h), macOS (60 fps, the display's limit) 17.34 W (3.0 h). Watts, lower is better; hours on a full battery.</desc>
<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="20" y="20" width="2" height="2" fill="#26233a"/></pattern></defs>
<rect width="1000" height="544" fill="#191724"/><rect width="1000" height="544" fill="url(#dots)"/>
<text x="500.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e0def4" font-weight="600" text-anchor="middle">How much power does the Mac draw?</text>
<text x="500.0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#908caa" text-anchor="middle">MacBook Air M2 8 GB · macOS 26.6.2 · the VM 4 CPUs, 4 GB · 2026-10-07</text>
<rect x="224" y="79" width="12" height="12" rx="3" fill="#ebbcba"/>
<text x="242" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e0def4" font-weight="600">OmacVM.app 3.0.3</text>
<rect x="371" y="79" width="12" height="12" rx="3" fill="#908caa"/>
<text x="389" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e0def4">macOS</text>
<text x="452" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6a86">watts, lower is better · hours on a full 52.6 Wh battery</text>
<text x="40" y="148.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e0def4" font-weight="600">Idle</text>
<text x="40" y="166.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86">the desktop, nothing open</text>
