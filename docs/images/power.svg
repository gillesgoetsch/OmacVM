<text x="500.0" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6a86" text-anchor="middle">The whole Mac, display included, from the battery's own telemetry; brightness 50 %; the VM alone in native full screen; on the charger.</text>
