<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 424" width="1000" height="424" role="img" aria-labelledby="t d">
<title id="t">Power draw of the whole Mac with Omarchy in OmacVM.app, and with macOS itself</title>
<desc id="d">Idle (the desktop, nothing open): OmacVM.app 3.0.3 6.13 W (8.6 h), macOS 5.20 W (10.1 h). Reading (Chrome scrolling a text page): OmacVM.app 3.0.3 6.11 W (8.6 h), macOS 5.48 W (9.6 h). YouTube 4K (VP9, SDR, 60 fps; both on the Mac's media engine): OmacVM.app 3.0.3 (Omarchy's Chromium) 10.10 W (5.2 h), macOS (Google Chrome) 6.07 W (8.7 h). Every core busy (every core at 100 %: the VM's 4, the Mac's 8): OmacVM.app 3.0.3 21.01 W (2.5 h), macOS 19.69 W (2.7 h). WebGL Aquarium (30,000 fish in Chrome; each draws its own frame rate): OmacVM.app 3.0.3 (19 fps) 17.11 W (3.1 h), macOS (60 fps, the display's limit) 17.34 W (3.0 h). Watts, lower is better; hours on a full battery.</desc>
<style>
:root{--card:#faf4ed;--edge:#dfdad9;--ink:#575279;--soft:#6f6b8a;--app:#d7827e;--mac:#797593}
@media (prefers-color-scheme: dark){:root{--card:#191724;--edge:#26233a;--ink:#e0def4;--soft:#908caa;--app:#ebbcba;--mac:#908caa}}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, monospace}
.ink{fill:var(--ink)}.soft{fill:var(--soft)}.b{font-weight:600}
.halo{stroke:var(--card);stroke-width:4;paint-order:stroke}
.app{fill:var(--app)}.mac{fill:var(--mac)}.card{fill:var(--card)}
.rule{stroke:var(--ink);stroke-opacity:.5;stroke-dasharray:3 3}
</style>
<rect width="1000" height="424" class="card"/>
<rect x="0.5" y="0.5" width="999" height="423" fill="none" stroke="var(--edge)"/>
<text x="36" y="34" font-size="17" class="ink b">How much power does the Mac draw?</text>
<text x="964" y="34" font-size="12" class="soft" text-anchor="end">MacBook Air M2 8 GB · macOS 26.6.2 · the VM 4 CPUs, 4 GB · 2026-10-07</text>
<rect x="36" y="49" width="10" height="10" rx="2" class="app"/>
<text x="51" y="58" font-size="12" class="ink b">OmacVM.app 3.0.3</text>
<rect x="167.88" y="49" width="10" height="10" rx="2" class="mac"/>
<text x="182.88" y="58" font-size="12" class="ink">macOS</text>
<text x="238.56" y="58" font-size="12" class="soft">watts, lower is better · hours on a full 52.6 Wh battery</text>
<text x="36" y="104.0" font-size="14" class="ink b">Idle</text>
<text x="36" y="120.0" font-size="11" class="soft">the desktop, nothing open</text>
<path d="M250,89.5 h416.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-416.0 z" class="app"/>
<text x="679.0" y="101.0" font-size="13" class="ink mono b halo">6.13 W</text>
<text x="735.4" y="101.0" font-size="12" class="soft mono halo">8.6 h</text>
<path d="M250,110.5 h352.3 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-352.3 z" class="mac"/>
<text x="615.3" y="122.0" font-size="13" class="ink mono halo">5.20 W</text>
<text x="671.6" y="122.0" font-size="12" class="soft mono halo">10.1 h</text>
<text x="36" y="162.0" font-size="14" class="ink b">Reading</text>
<text x="36" y="178.0" font-size="11" class="soft">Chrome scrolling a text page</text>
<path d="M250,147.5 h416.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-416.0 z" class="app"/>
<text x="679.0" y="159.0" font-size="13" class="ink mono b halo">6.11 W</text>
<text x="735.4" y="159.0" font-size="12" class="soft mono halo">8.6 h</text>
<path d="M250,168.5 h372.7 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-372.7 z" class="mac"/>
<text x="635.7" y="180.0" font-size="13" class="ink mono halo">5.48 W</text>
<text x="692.1" y="180.0" font-size="12" class="soft mono halo">9.6 h</text>
<text x="36" y="213.0" font-size="14" class="ink b">YouTube 4K</text>
<text x="36" y="229.0" font-size="11" class="soft">VP9, SDR, 60 fps; both on the Mac's</text>
<text x="36" y="243.0" font-size="11" class="soft">media engine</text>
<path d="M250,205.5 h416.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-416.0 z" class="app"/>
<text x="679.0" y="217.0" font-size="13" class="ink mono b halo">10.10 W</text>
<text x="743.4" y="217.0" font-size="12" class="soft mono halo">5.2 h</text>
<text x="789.6" y="217.0" font-size="11" class="soft halo">Omarchy's Chromium</text>
<path d="M250,226.5 h248.4 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-248.4 z" class="mac"/>
<text x="511.4" y="238.0" font-size="13" class="ink mono halo">6.07 W</text>
<text x="567.8" y="238.0" font-size="12" class="soft mono halo">8.7 h</text>
<text x="614.0" y="238.0" font-size="11" class="soft halo">Google Chrome</text>
<text x="36" y="271.0" font-size="14" class="ink b">Every core busy</text>
<text x="36" y="287.0" font-size="11" class="soft">every core at 100 %: the VM's 4, the</text>
<text x="36" y="301.0" font-size="11" class="soft">Mac's 8</text>
<path d="M250,263.5 h416.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-416.0 z" class="app"/>
<text x="679.0" y="275.0" font-size="13" class="ink mono b halo">21.01 W</text>
<text x="743.4" y="275.0" font-size="12" class="soft mono halo">2.5 h</text>
<path d="M250,284.5 h389.6 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-389.6 z" class="mac"/>
<text x="652.6" y="296.0" font-size="13" class="ink mono halo">19.69 W</text>
<text x="717.0" y="296.0" font-size="12" class="soft mono halo">2.7 h</text>
<text x="36" y="329.0" font-size="14" class="ink b">WebGL Aquarium</text>
<text x="36" y="345.0" font-size="11" class="soft">30,000 fish in Chrome; each draws</text>
<text x="36" y="359.0" font-size="11" class="soft">its own frame rate</text>
<path d="M250,321.5 h410.4 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-410.4 z" class="app"/>
<text x="673.4" y="333.0" font-size="13" class="ink mono b halo">17.11 W</text>
<text x="737.8" y="333.0" font-size="12" class="soft mono halo">3.1 h</text>
<text x="784.0" y="333.0" font-size="11" class="soft halo">19 fps</text>
<path d="M250,342.5 h416.0 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-416.0 z" class="mac"/>
<text x="679.0" y="354.0" font-size="13" class="ink mono halo">17.34 W</text>
<text x="743.4" y="354.0" font-size="12" class="soft mono halo">3.0 h</text>
<text x="789.6" y="354.0" font-size="11" class="soft halo">60 fps, the display's limit</text>
<text x="36" y="396" font-size="11" class="soft">The whole Mac, display included, from the battery's own telemetry; brightness 50 %; the VM alone in native full screen; on the charger.</text>
<text x="36" y="412" font-size="11" class="soft">Median of 3 per load, each load on its own scale. Hours: the Air's 52.6 Wh over the draw. Raw runs: docs/benchmarks.</text>
</svg>
