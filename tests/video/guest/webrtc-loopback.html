<!doctype html>
<meta charset="utf-8">
<title>WebRTC encode loopback</title>
<video id="v" autoplay muted playsinline width="640"></video>
<pre id="log"></pre>
<script>
// A camera (or the screen, or a whole call: camera, microphone and the screen) sent
// through an RTCPeerConnection pair inside this page, H.264 preferred; after SECONDS
// posts the senders' stats (encoder implementation, frames encoded, encode time) to
// /result. ?source=camera|screen|call&seconds=N&w=&h=&fps=
const q = new URLSearchParams(location.search);
const source = q.get('source') || 'camera', seconds = +(q.get('seconds') || 20);
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720), FPS = +(q.get('fps') || 30);
const log = m => { document.getElementById('log').textContent += m + '\n'; };
const post = (kind, o) => fetch('/' + kind, { method: 'POST', body: JSON.stringify(o) });

async function run() {
  const constraints = { width: W, height: H, frameRate: FPS };
  const stream = new MediaStream();
  if (source !== 'screen')
    (await navigator.mediaDevices.getUserMedia({ video: constraints, audio: true }))
      .getTracks().forEach(t => stream.addTrack(t));
  if (source !== 'camera')
    (await navigator.mediaDevices.getDisplayMedia({ video: constraints, audio: false }))
      .getVideoTracks().forEach(t => { t.contentHint = 'detail'; stream.addTrack(t); });
  const pc1 = new RTCPeerConnection(), pc2 = new RTCPeerConnection();
  pc1.onicecandidate = e => e.candidate && pc2.addIceCandidate(e.candidate);
  pc2.onicecandidate = e => e.candidate && pc1.addIceCandidate(e.candidate);
  pc2.ontrack = e => { if (e.track.kind === 'video') document.getElementById('v').srcObject = new MediaStream([e.track]); };
  for (const track of stream.getTracks()) {
    const t = pc1.addTransceiver(track, { direction: 'sendonly' });
    if (track.kind === 'video') {
      const h264 = RTCRtpSender.getCapabilities('video').codecs.filter(c => c.mimeType === 'video/H264');
      if (h264.length) t.setCodecPreferences(h264);
      const p = t.sender.getParameters();
      p.encodings = [{ maxBitrate: 4000000 }];
      await t.sender.setParameters(p).catch(() => {});
    }
  }
  await pc1.setLocalDescription(await pc1.createOffer());
  await pc2.setRemoteDescription(pc1.localDescription);
  await pc2.setLocalDescription(await pc2.createAnswer());
  await pc1.setRemoteDescription(pc2.localDescription);
  post('start', { source, W, H, FPS, tracks: stream.getTracks().map(t => t.kind + ':' + t.label) });
  const t0 = performance.now();
  const sample = async () => {
    const stats = await pc1.getStats(), rx = await pc2.getStats();
    const out = { senders: [] };
    stats.forEach(s => {
      if (s.type === 'outbound-rtp' && s.kind === 'video') {
        const src = stats.get(s.mediaSourceId);
        const label = (src && stream.getTracks().find(t => t.id === src.trackIdentifier) || {}).label || '';
        out.senders.push({ label, encoder: s.encoderImplementation, powerEfficient: s.powerEfficientEncoder,
          framesEncoded: s.framesEncoded, totalEncodeTime: s.totalEncodeTime, fps: s.framesPerSecond,
          width: s.frameWidth, height: s.frameHeight, bytes: s.bytesSent, codecId: s.codecId,
          qualityLimitation: s.qualityLimitationReason });
      }
      if (s.type === 'outbound-rtp' && s.kind === 'audio') out.audioPackets = s.packetsSent;
    });
    out.senders.forEach(o => stats.forEach(s => {
      if (s.type === 'codec' && s.id === o.codecId) o.codec = s.mimeType + ' ' + (s.sdpFmtpLine || ''); }));
    Object.assign(out, out.senders[0] || {});
    rx.forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video')
      Object.assign(out, { decoder: s.decoderImplementation, framesDecoded: s.framesDecoded }); });
    out.t = (performance.now() - t0) / 1000;
    log(JSON.stringify(out));
    return out;
  };
  const tick = setInterval(sample, 2000);
  setTimeout(async () => { clearInterval(tick); post('result', await sample()); }, seconds * 1000);
}
run().catch(e => { log('error ' + e); post('result', { error: String(e) }); });
</script>
