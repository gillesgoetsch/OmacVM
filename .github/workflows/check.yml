# Quick checks on every pull request and on main: syntax, ShellCheck errors,
# the app's and the Mac helpers' builds and offline tests (the guest agents'
# also on Linux) and the control centre's tests. No signing beyond ad hoc, no VMs.
# On the Mac mini also OmacVM.app as a release puts it together (job app).
#
# Where the macOS job runs: pushes to main and pull requests from branches of
# this repository run on the maintainer's Mac mini (self-hosted, label
# omacvm-mini; macOS 27, Xcode 27). Pull requests from forks, and a manual
# "Run workflow", run on GitHub's macos-15, so outside code never runs on the
# mini and macOS 15 / Xcode 16 can still be checked before a release. Never add
# pull_request_target here. The mini runs other work too: the steps below keep
# their files in the job's own folders and clean up after themselves.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A fork's pull request has another head repository (or none, once the fork
    # is deleted): false, so macos-15. fromJSON gives the runner's label list.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","omacvm-mini"]') || 'macos-15' }}
    # the mini: fresh test binaries can wait minutes before they start (macOS); the
    # job then needs more than 35 min although nothing is wrong (#258)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # No token left in .git/config on a machine that stays.
          persist-credentials: false

      - name: Where this runs; a temp folder of the job's own
        run: |
          echo "runner: ${RUNNER_NAME:-?} (${{ runner.environment }}), $(sw_vers -productVersion), $(xcrun swift --version 2>/dev/null | head -1)"
          # Short path on purpose (Unix sockets in tests); removed at the end.
          tmp=${TMPDIR:-/tmp}; job_tmp=$(mktemp -d "${tmp%/}/j.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
          echo "JOB_TMP=$job_tmp" >> "$GITHUB_ENV"

      - name: List shell scripts
        run: |
          # The same list CONTRIBUTING.md's quick checks use.
          .github/shell-files.sh > "$RUNNER_TEMP/shell-files"
          wc -l < "$RUNNER_TEMP/shell-files"

      - name: bash -n (macOS's bash 3.2, which the Mac side runs on)
        run: |
          fail=0
          while read -r f; do /bin/bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }; done < "$RUNNER_TEMP/shell-files"
          exit $fail

      - name: ShellCheck (errors only)
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          tr '\n' '\0' < "$RUNNER_TEMP/shell-files" | xargs -0 shellcheck -S error -s bash

      - name: Python compiles
        run: |
          git ls-files -z '*.py' | xargs -0 python3 -m py_compile
          python3 -m py_compile src/control/omacvm

      - name: omacvm report runs on macOS's own python3
        run: /usr/bin/python3 -c "import sys; sys.path.insert(0, 'src/control'); import omacvm_cc.report, omacvm_cc.collect, omacvm_cc.bridge, omacvm_cc.state"

      - name: Control centre tests (state, redaction, Textual Pilot against a fake Mac)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          # Textual as the VM gets it: OmacVM's own wheels (src/control/vendor).
          "$RUNNER_TEMP/venv/bin/pip" install -q --no-deps src/control/vendor/*.whl
          "$RUNNER_TEMP/venv/bin/pip" install -q pytest pyte
          cd src/control && "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests

      - name: Bridge's control centre and Touch ID requests (allow-list, limits, manifest signatures, LocalAuthentication mocked)
        run: src/bridge/mac/tests/run.sh

      - name: Touch ID's PAM client against a fake Bridge, and its PAM lines in and out
        run: src/tests/touchid-client.sh

      - name: Touch ID turned on says ready (apply), what is missing (check on the Mac and in the VM)
        run: src/tests/touchid-ready.sh

      - name: Update parts cover src/
        run: python3 src/release/manifest.py parts > /dev/null

      - name: Boot splash and start animation (offline, from the patch)
        run: app/runtime/Tests/display/check-boot-splash.sh

      - name: OmacVM.app builds
        working-directory: app/app
        run: swift build

      - name: OmacVM.app VM window fits a 13-inch MacBook (pictures in the run's artifacts)
        working-directory: app/app
        timeout-minutes: 5
        run: .build/debug/OmacVM --render-vm-window "$RUNNER_TEMP/vm-window"

      - name: Keep the VM window pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-window
          path: ${{ runner.temp }}/vm-window
          if-no-files-found: ignore

      - name: OmacVM.app network switch tests (fast network <-> user network)
        working-directory: app/app
        run: swift run net-tests

      - name: OmacVM.app USB device tests (which devices a VM may have, QEMU arguments)
        working-directory: app/app
        run: swift run usb-tests

      - name: OmacVM.app Mac folder arguments
        working-directory: app/app
        run: swift run folder-tests

      - name: OmacVM.app build window tests (progress lines from the VM, speed, time left, log tail)
        working-directory: app/app
        run: swift run build-progress-tests

      - name: Package progress filter (src/vm/progress.sh on pacman output)
        run: src/tests/build-progress.sh

      - name: OmacVM.app new VM features (Omanotch on with a notch)
        working-directory: app/app
        run: swift run features-tests

      - name: OmacVM.app Touch ID port relay (org.omacvm.auth, no Bridge, no dialog)
        working-directory: app/app
        run: swift run auth-tests

      - name: OmacVM.app Touch ID panel (never on screen, no LAContext)
        working-directory: app/app
        run: swift run touchid-panel-tests

      - name: OmacVM.app window rules (custom resources, disk, omacvm in Terminal, keyboard note)
        working-directory: app/app
        run: swift run window-tests

      - name: OmacVM.app Restart the Desktop after Later (the app's side)
        working-directory: app/app
        run: swift run desktop-tests
      - name: OmacVM.app sound delay for the VM (QEMU's part, the Mac's output, limits)
        working-directory: app/app
        run: swift run audio-tests

      - name: Install dialog defaults (previous copy, Run Without Installing)
        run: src/tests/install-defaults.sh

      - name: Fusion guest install (first Hyprland build from the source tree)
        run: src/tests/fusion-install.sh

      - name: OmacVM.app update checks
        working-directory: app/app
        run: swift run update-tests

      - name: Mac helpers build (Gestures, Bridge)
        run: |
          src/gestures/mac/build.sh
          src/bridge/mac/build.sh

      - name: Omanotch wallpaper runs through the notch strip (patch on Omarchy's file, both NOTCH places)
        run: src/tests/notch-wallpaper.sh

      - name: Omanotch offline tests
        run: |
          src/omanotch/mac/test.sh
          src/omanotch/guest/tests/test.sh

      - name: External display brightness offline tests (Bridge and VM side)
        run: |
          src/bridge/mac/test.sh
          src/tests/external-brightness.sh

      - name: Building behind a proxy (scutil samples, the VM's variables, sudo, systemd-run, retries, a stub proxy)
        run: src/tests/proxy.sh

      - name: Which VM --vm NAME means
        run: src/tests/vm-names.sh

      - name: Two builds at once (build-live.sh waits for the other one's work folder)
        run: src/tests/build-live-lock.sh

      - name: The control centre opened from the Mac (the VM's script, a made-up Hyprland)
        run: src/tests/cc-open.sh
      - name: omacvm check's media keys line (normal Bridge log lines are not failures)
        run: src/tests/media-keys-check.sh
      - name: omacvm check's Gestures line (waiting for a permission at start vs listening)
        run: src/tests/gestures-state.sh
      - name: omacvm check finds the Bridge and Gestures by process and reads only their own log lines
        run: src/tests/helper-running.sh

      - name: omacvm vms never waits on UTM's data
        run: src/tests/vms-no-container.sh < /dev/null
      - name: omacvm never starts a VM by itself, nor with an old copy of the app
        run: src/tests/no-autostart.sh < /dev/null

      - name: A Mac helper that does not build
        run: src/tests/mac-install.sh
      - name: A test HOME never uses the helpers' production LaunchAgent labels
        run: src/tests/test-labels.sh

      - name: Release keys on the command line (either key, Developer ID teams, a named spare)
        run: src/tests/release-keys.sh

      - name: Release script (KosmicKrisp from another Mac, bad arguments)
        run: src/tests/release-script.sh

      - name: Vulkan (Venus) driver step for app VMs (when it builds Mesa's vulkan-virtio)
        run: src/tests/venus-driver.sh
      - name: The guest check's Vulkan line without vulkaninfo says "not checked" (#332)
        run: src/tests/vulkaninfo-missing.sh

      - name: Guest packages never update one alone (no partial update), GBM guard undoes a broken install
        run: src/tests/pkg-safe.sh

      - name: Default keyring for prebuilt VMs (first boot, apply, check)
        run: src/tests/default-keyring.sh

      - name: Prebuilt manifests are checked (untrusted input)
        run: src/tests/prebuilt-manifest.sh

      - name: Prebuilt image disk is packed sparse (holes for zeros, owner root)
        run: src/tests/prebuilt-sparse.sh

      - name: Prebuilt images for Parallels, UTM and Fusion are checked (untrusted input)
        run: |
          command -v zstd >/dev/null || brew install zstd
          src/tests/prebuilt-routes.sh

      - name: Ctrl-C in omacvm build stops the running step (a terminal, no VM)
        run: src/tests/build-ctrlc.sh

      - name: omacvm build checks free space on the drive the VM goes to (every route, no VM)
        run: src/tests/build-space.sh

      - name: UTM VM on another drive (--vm-dir; a stand-in UTM, no VM)
        run: src/tests/utm-vm-dir.sh
      - name: UTM's shared network on another range is found before the install
        run: src/tests/utm-network.sh

      - name: omacvm-netd offline tests
        run: src/net/mac/test.sh

      - name: App battery bridge's notification thread ends on stop
        run: src/tests/app-battery.sh

      - name: Battery watts and time left (Mac snapshot, VM agent, module on a kernel stand-in)
        run: src/tests/battery.sh

      - name: Gestures offline test (which VM gets them)
        run: src/gestures/mac/test.sh

      - name: Bridge offline tests (media-key tap, where each media key goes, Wi-Fi state)
        run: src/bridge/mac/test-models.sh

      - name: Bridge brightness keys read from the keyboard (made-up keyboards)
        run: src/bridge/mac/test-hid.sh

      - name: OmacVM.app's signed Mac helpers are used only for the same sources
        run: src/tests/prebuilt-helpers.sh

      - name: A Mac without Xcode's Command Line Tools (OmacVM.app's route runs none of macOS's stubs)
        run: src/tests/no-clt.sh

      - name: Escape combo setting and where a VM window opens
        run: src/tests/app-escape-window.sh

      - name: Magic Mouse swipe setting (3 or 4 fingers) and its row, only with a Magic Mouse
        run: src/tests/app-mouse-swipe.sh

      - name: The note when macOS refuses the VM's keyboard tap
        run: src/tests/app-key-access.sh

      - name: Only OmacVM writes the Bridge's cli file (test copies keep away)
        run: src/tests/app-cli-file.sh

      - name: An older omacvm never takes a newer VM back (version order, apply/enable/disable/update stop first)
        run: src/tests/version-guard.sh

      - name: install.sh's checkout follows the releases, not a main behind them (#291)
        run: src/tests/follow-release.sh

      - name: The test app's own omacvm run by hand is the test identity
        run: src/tests/app-cli-identity.sh

      - name: The desktop restarts by itself after a lost GPU context (app rules, VM script)
        run: src/tests/app-desktop-recovery.sh

      - name: The vulkan feature (VM folder file, guest Mesa step)
        run: src/tests/vulkan-feature.sh

      - name: Feature state truth (the record against the fast network and SDDM autologin)
        run: src/tests/feature-truth.sh

      - name: After an update from an older OmacVM (Textual without pacman, the Vulkan driver's words)
        run: src/tests/upgrade-path.sh

      - name: A feature switch runs only its parts (no Hyprland reload for the rest)
        run: src/tests/feature-switch.sh

      - name: The vulkan feature's Mesa build (build tools come and go)
        run: src/tests/venus-build-tools.sh

      - name: The x86-apps feature (box64 package, binfmt rule, off)
        run: src/tests/x86-apps.sh

      - name: Graphics setting (OpenGL, Vulkan, Automatic; app and omacvm agree)
        run: src/tests/graphics-setting.sh
      - name: OmacVM.app's notch area (FullPanel or native, the app and omacvm agree, omacvm notch)
        run: src/tests/notch-setting.sh

      - name: App VMs skip routes of a card without a link (network moves without a gap)
        run: src/tests/net-linkdown.sh

      - name: Where the app and its VMs are (omacvm and the app agree)
        run: src/tests/app-paths.sh

      - name: An unknown VM name never falls back to another VM; the test app never uses the installed app's VMs
        run: src/tests/app-vm-pick.sh

      - name: Open Existing VM picks the VM's folder or its parent; a VM in use elsewhere is not started
        run: src/tests/app-open-vm.sh

      - name: A VM from a bigger Mac starts at this Mac's Best tier; vm.env keeps its size
        run: src/tests/app-start-size.sh

      - name: A VM not shut down cleanly, or copied while it ran, warns before a start
        run: src/tests/app-run-marker.sh

      - name: Update VM never waits forever (disk errors, a read-only VM, a hang)
        run: src/tests/update-vm-watch.sh

      - name: An app VM folder's own SSH key is made, found and offered first (a VM copied to another Mac)
        run: src/tests/vm-ssh-key.sh

      - name: e2e harnesses put the test app's settings back and start only test VMs
        run: src/tests/e2e-test-vms.sh

      - name: Stale-frame check reads the guest's scanout and finds changed pixels below the bar (#167)
        run: src/tests/stale-frames-diff.sh

      - name: An app VM's address comes from its running QEMU (fast network turned off while it runs)
        run: src/tests/app-vm-address.sh

      - name: The Bridge runs omacvm for the app's VMs through the app (only the Bridge, only the app's omacvm)
        run: src/tests/app-control-run.sh

      - name: Display sync (scales at 4K and 5K, nothing sent twice, the loop guard)
        run: |
          # The VM side runs on Arch's bash 5; macOS's own is 3.2.
          [ -x /opt/homebrew/bin/bash ] || brew install bash
          python3 src/app/guest/tests/test_display_sync.py

      - name: Full-screen pointer guard (motion maths)
        run: app/runtime/Tests/display/test-pointer-guard.sh

      - name: App menu memory lines (VM memory, graphics memory)
        run: app/runtime/Tests/display/test-gpu-memory-menu.sh

      - name: Graphics memory guard keeps a part for the desktop (the rules)
        run: app/runtime/Tests/virgl/test-gpu-guard-policy.sh

      - name: App menu Restart the Desktop after Later (QEMU's side)
        run: app/runtime/Tests/display/test-restart-desktop.sh

      - name: The VM takes the pointer without a click; the Mac's cursor hides once the guest draws its own
        run: app/runtime/Tests/display/test-pointer-start.sh

      - name: Mac pointer for the VM (experimental hardware cursor rules, guest image checks)
        run: app/runtime/Tests/display/test-hw-cursor.sh
      - name: One pointer between the VM and Omanotch's strip (the guest's goes into NOTCH)
        run: app/runtime/Tests/display/test-notch-park.sh
      - name: Guest sizes that fit Omarchy's scale presets (full screen, window steps)
        run: app/runtime/Tests/display/test-clean-size.sh
      - name: FullPanel's rules (every notched MacBook, external displays, moves between them)
        run: app/runtime/Tests/display/test-fullpanel.sh

      - name: macOS's shortcuts go to the VM while it has the keyboard (the whole list)
        run: app/runtime/Tests/keys/test-shortcuts.sh

      - name: Mac input methods in QEMU's window code (rules, hooks; off = every key as before)
        run: app/runtime/Tests/keys/test-ime.sh

      - name: Mac input methods, VM side (the Fcitx5 module's protocol, fuzzed; its VM step)
        run: src/ime/tests/run.sh

      - name: QEMU's full-grab tap goes when Accessibility is taken away (issue 192)
        run: app/runtime/Tests/keys/test-tap-permission.sh

      - name: OmacVM.app full screen always in its own Space (no notch cover; escape combo stays out)
        run: src/tests/app-fullscreen-space.sh

      - name: One OmacVM in the Dock (QEMU started as the app, found by its kernel path)
        run: src/tests/app-dock-one-app.sh

      - name: Keyboard light steps (offline)
        run: src/tests/keyboard-light.sh

      - name: A feature that is off is off on every route (VM side, checks, Mac side)
        run: src/tests/features-off.sh

      - name: Mac input methods switched while the VM is stopped come with its next start (#316)
        run: src/tests/mac-ime-start.sh

      - name: omacvm features' checklist keeps one line per row (pseudo-terminal, #292)
        run: src/tests/features-checklist.sh

      - name: Guest check accepts NOTCH right above the built-in display (offline)
        run: src/tests/notch-check.sh

      - name: OmacVM.app moves VM folders safely (fixtures, small disk images)
        run: src/tests/app-storage.sh

      - name: OmacVM.app sees the drive with a running VM drop off (small disk image, detached by force)
        run: src/tests/app-drive-drop.sh

      - name: Benchmark chart and the pages that quote it agree
        run: src/tests/bench-docs.sh

      - name: OmacVM.app while the VM idles (guest agent connection, clipboard poll)
        run: src/tests/app-idle.sh

      - name: Guest agents offline tests (desktop check, idle waits, display panel, camera frame times)
        run: |
          python3 src/app/guest/tests/test_omacvm_displays.py
          python3 src/app/guest/tests/test_idle_waits.py
          python3 src/app/guest/tests/test_monitor_widget.py
          python3 src/omanotch/guest/tests/test_display_panel.py
          python3 src/camera/guest/tests/test_frames.py
          python3 src/app/guest/tests/test_audio_latency.py

      - name: Final-round benchmark kit offline tests (one timing method per row, what is left out, preflight)
        run: tests/bench/final-round/test.sh

      - name: Sound on a busy Mac and a Mac audio device that does not answer (log lines, check, test stub)
        run: src/tests/audio-timing.sh

      - name: No App Nap for QEMU's window process (patch pinned, applied, before the run loop, idle sleep kept)
        run: src/tests/app-nap.sh

      - name: Chromium's video decoder comes back (GPU retry, pacman hook, check says why)
        run: src/tests/vdecd-down.sh

      - name: Sound does not hang on Chromium's video decoder (WirePlumber rule, install order, off); its device starts the daemon
        run: src/tests/vdec-wireplumber.sh

      - name: CI builds OmacVM.app on the mini (the app job, its runtime cache)
        run: src/tests/ci-app-build.sh

      - name: Clean up (build folders, the job's temp folder)
        if: always()
        run: |
          [ -z "${JOB_TMP:-}" ] || rm -rf "$JOB_TMP"
          # SwiftPM's .build, the helpers' builds, __pycache__: nothing of this
          # job stays on a self-hosted runner's disk until the next checkout.
          git clean -ffdxq 2>/dev/null || true

  # OmacVM.app as app/scripts/build-app.sh puts it together for a release (the
  # launcher and Touch ID panel built for release, the QEMU runtime, the Mac
  # helpers, its python3, an ad hoc signature), so a break shows on the pull
  # request, not at release time. Only on the mini, where the QEMU runtime
  # comes from a cache kept per runner (.github/app-runtime-cache.sh); a new
  # runtime (its patches or build scripts changed) is built once there. Forks
  # and a manual run (macos-15, no cache) skip this job.
  app:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","omacvm-mini"]') || 'macos-15' }}
    # A cache hit takes a few minutes; a runtime built from source up to ~30.
    timeout-minutes: 45
    defaults:
      run:
        # bash -eo pipefail: a build that fails fails the step through tee.
        shell: bash
    env:
      # Its own name and id: no app on the mini can be taken for this copy.
      APP_NAME: OmacVM CI
      APP_ID: org.omacvm.app.ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Where this runs; a temp folder of the job's own
        run: |
          echo "runner: ${RUNNER_NAME:-?} (${{ runner.environment }}), $(sw_vers -productVersion), $(xcrun swift --version 2>/dev/null | head -1)"
          tmp=${TMPDIR:-/tmp}; job_tmp=$(mktemp -d "${tmp%/}/j.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
          echo "JOB_TMP=$job_tmp" >> "$GITHUB_ENV"
          # Beside the runner's tool cache: kept between jobs, never in the checkout.
          echo "OMACVM_CI_RUNTIME_CACHE=${RUNNER_TOOL_CACHE:?}/omacvm-runtime" >> "$GITHUB_ENV"

      - name: QEMU runtime from the cache
        run: |
          key=$(app/scripts/build-app.sh --runtime-inputs)
          echo "runtime inputs $key"
          .github/app-runtime-cache.sh restore app/runtime/.build "$key"

      - name: OmacVM.app builds (build-app.sh, not a release)
        run: |
          start=$(date +%s)
          app/scripts/build-app.sh --name "$APP_NAME" --id "$APP_ID" 2>&1 | tee "$JOB_TMP/build.log"
          echo "build-app.sh took $(( $(date +%s) - start )) s"
          # The runtime's build tests, when it was built from source.
          if grep -nw FAIL "$JOB_TMP/build.log"; then echo "::error::a runtime build test failed"; exit 1; fi

      - name: The app is complete (commit, id, version, signature, its parts)
        run: |
          app="app/dist/$APP_NAME.app"; c=$app/Contents; p=$c/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Print $1" "$p"; }
          fail=0
          want() { if [ "$2" = "$3" ]; then echo "ok   $1"; else echo "::error::$1: want '$2', got '$3'"; fail=1; fi; }
          want OmacVMCommit "$(git rev-parse HEAD)" "$(pb OmacVMCommit)"
          want CFBundleIdentifier "$APP_ID" "$(pb CFBundleIdentifier)"
          want CFBundleShortVersionString "$(cat src/VERSION)" "$(pb CFBundleShortVersionString)"
          for f in MacOS/OmacVM Resources/runtime/bin/OmacVM Resources/firmware/edk2-aarch64-code.fd \
                   Resources/runtime/lib/OmacVMTouchIDPanel.dylib Library/LaunchServices/org.omacvm.netd \
                   Resources/omacvm/omacvm Helpers; do
            [ -e "$c/$f" ] && echo "ok   $f" || { echo "::error::no $f in the app"; fail=1; }
          done
          # Since 3.0.5 the app carries its own python3 (app/scripts/fetch-python.sh).
          if [ -x app/scripts/fetch-python.sh ]; then
            "$c/Resources/python/bin/python3" -I -c 'import hashlib, json, plistlib; print("ok   python3")' || { echo "::error::the app's python3 does not run"; fail=1; }
          fi
          codesign --verify --deep --strict "$app" && echo "ok   signature" || fail=1
          du -sh "$app"
          exit $fail

      - name: Keep the runtime for the next run (also when the app part failed)
        if: ${{ !cancelled() }}
        run: |
          if grep -qw FAIL "$JOB_TMP/build.log" 2>/dev/null; then echo "skip (a runtime build test failed)"
          else .github/app-runtime-cache.sh save app/runtime/.build; fi

      - name: Clean up (the app, build folders, the job's temp folder)
        if: always()
        run: |
          [ -z "${JOB_TMP:-}" ] || rm -rf "$JOB_TMP"
          git clean -ffdxq 2>/dev/null || true

  # The guest agents are Linux programs: their inotify and pidfd waits only
  # run here (on the Mac those tests skip). Arm, like the guest.
  guest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Guest agents tests on Linux (inotify, pidfd, idle waits)
        run: |
          python3 src/app/guest/tests/test_omacvm_displays.py -v
          python3 src/app/guest/tests/test_idle_waits.py -v
          python3 src/app/guest/tests/test_monitor_widget.py -v
          python3 src/omanotch/guest/tests/test_display_panel.py -v
          python3 src/camera/guest/tests/test_frames.py -v

      - name: A feature switch on Linux (GNU sed, glide off path)
        run: src/tests/feature-switch.sh

      - name: Touch ID's PAM client on Linux, as in the VM (fake Bridge and logind)
        run: src/tests/touchid-client.sh

      - name: The guest's udev rules parse (udevadm verify)
        run: udevadm verify --resolve-names=never src/vdec/guest/70-omacvm-vdec.rules src/ime/guest/70-omacvm-ime.rules

      - name: Mac input methods' Fcitx5 module builds (Ubuntu's Fcitx5), its protocol test with the sanitizers
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends g++ pkg-config libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
          src/ime/tests/build-addon.sh
          src/ime/tests/run.sh

      - name: Hyprland Lua files parse (omacvm_app.lua), and keep the outputs' rules over a config reload
        run: |
          # Hyprland 0.56 runs Lua 5.5 (a loop variable is read-only there; 5.4 accepts it)
          curl -fsSL -o /tmp/lua.tgz https://www.lua.org/ftp/lua-5.5.0.tar.gz
          echo "57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d  /tmp/lua.tgz" | sha256sum -c -
          tar -xzf /tmp/lua.tgz -C /tmp && make -s -C /tmp/lua-5.5.0 linux >/dev/null
          /tmp/lua-5.5.0/src/luac -p src/app/guest/omacvm_app.lua src/omanotch/guest/hypr/notchbar.lua
          d=$(mktemp -d)
          XDG_RUNTIME_DIR=$d XDG_CONFIG_HOME=$d /tmp/lua-5.5.0/src/lua src/app/guest/tests/omacvm_app_test.lua src/app/guest/omacvm_app.lua

      - name: Chromium's video decoder builds, and waits for a GPU that is not usable (no render node here)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends pkg-config gcc libva-dev libgbm-dev libegl-dev \
            libgles-dev libdrm-dev libavcodec-dev libavutil-dev libsystemd-dev
          OMACVM_VDECD_SYSTEMD=1 src/tests/vdecd-down.sh
