# Blank issues stay on: older pre-filled links (?title=...&body=...) need them.
blank_issues_enabled: true
contact_links:
  - name: Troubleshooting
    url: https://github.com/gillesgoetsch/omacvm/blob/main/docs/troubleshooting.md
