  - name: A problem in Omarchy itself
    url: https://github.com/omacom/omarchy-mac/issues
    about: If it also happens without a VM, it belongs to omarchy-mac.
  - name: Contributing
    url: https://github.com/gillesgoetsch/omacvm/blob/main/CONTRIBUTING.md
    about: How to build, test and send a pull request.
